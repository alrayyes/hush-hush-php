name: Bug report
description: Something in the SDK is broken and needs fixing
labels: ["kind/bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What's wrong, in plain terms.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Exact steps, including SDK version and PHP version.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead.
    validations:
      required: true
