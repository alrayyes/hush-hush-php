# codegen.yml opens a regeneration pull request whenever hush-hush's spec
# moves but never merges it -- merging is the account-wide standing
# exception rules/sdk-generation.md's "Regeneration in CI" section
# documents (Ryan, 2026-09-26), not only asserted in comments here: merge
# once CI is green, the same way a Renovate/Dependabot/release-please PR
# already does, whether oasdiff classified the underlying spec change as
# additive or breaking -- there's no human judgment left to add on top of
# that classification, so this workflow doesn't gate on the commit's
# breaking-change marker (an earlier version did, per #115, before the
# exception covered breaking changes too).
#
# Gated on the label codegen.yml applies and its fixed branch name --
# codegen alone could plausibly land on an unrelated hand-written PR
# about the generator pipeline itself, so both together are what keep this
# scoped to codegen.yml's own regeneration PRs.
#
# pull_request, not pull_request_target: codegen.yml's pull request comes
# from a branch on this repo (codegen/regenerate), never a fork.
#
# types lists labeled on purpose: codegen.yml opens the pull request and
# applies the codegen label as a separate call afterwards, so the opened run
# can see no label and skip, and nothing re-checks it. labeled re-runs this
# once the label lands. For any other label the job's if still skips it, and
# arming auto-merge again is idempotent. Same fix as release-auto-merge.yml.
# https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#pull_request
name: codegen-auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: |
      github.event.pull_request.head.ref == 'codegen/regenerate' &&
      contains(github.event.pull_request.labels.*.name, 'codegen')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # RELEASE_TOKEN, not the default GITHUB_TOKEN: same anti-recursion-
      # guard gap release-auto-merge.yml documents -- a GITHUB_TOKEN merge
      # produces a commit GitHub won't re-trigger workflows on, which
      # would leave this repo's own release.yml never firing after an
      # auto-merged regeneration lands on main.
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
