# The gate. Every command in here has a twin in lefthook.yml, so a green
# pre-commit means a green pipeline and neither can drift into being the only
# place a rule is enforced.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # composer.json's own require.php stays >=8.2 - that's what a real
  # consumer needs, and --no-dev never touches phpunit at all. This is
  # only the interpreter CI itself runs tests under, which has to satisfy
  # every require-dev tool's own floor too - phpunit 13.3.2 requires
  # >=8.4.1 (composer.json's config.platform.php already assumed this),
  # and running it under 8.2 fails before a single test does: a
  # transitive dependency (sebastian/diff) uses syntax 8.2 can't even
  # parse, surfacing as spurious failures across lint/test/contract/
  # pact-consumer that have nothing to do with the code under test.
  PHP_VERSION: "8.4"

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:2.9.5
          extensions: ffi
      - run: composer install --prefer-dist --no-progress
      # Not --strict: it treats "exact version constraints should be
      # avoided" as a failing warning, which directly fights this org's
      # deliberate pin-everything convention (see rules/dependencies.md).
      - run: composer validate
      - run: vendor/bin/phpstan analyse --memory-limit=512M
      - run: vendor/bin/phpmd src text phpmd.xml.dist --exclude src/Generated
      - run: vendor/bin/phpcs
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - run: vendor/bin/rector process --dry-run
      - run: composer normalize --dry-run
      - run: composer audit

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:2.9.5
          extensions: ffi
          coverage: pcov
      - run: composer install --prefer-dist --no-progress
      # The reports are written on every run, pull requests included, so a
      # broken step fails before the merge. Clover is PHPUnit's native
      # coverage file, Cobertura is the one other tools read.
      - name: phpunit (hand-written layer only; see design.md's testing layers)
        run: |
          mkdir -p reports/tests reports/coverage
          vendor/bin/phpunit --testsuite unit \
            --log-junit reports/tests/junit.xml \
            --coverage-html reports/coverage \
            --coverage-cobertura reports/coverage/coverage.xml \
            --coverage-clover reports/coverage/clover.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: reports
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: reports/coverage/clover.xml
          # A Dependabot PR doesn't get repo secrets by default (GitHub's
          # own restriction, not a misconfiguration here) - CODECOV_TOKEN
          # is empty on that run, and this repo's branch protection makes
          # Codecov refuse a tokenless upload ("Token required because
          # branch is protected"). That's an upload hiccup on an
          # unprivileged run, not a real test regression - true here would
          # fail every Dependabot PR's CI on that basis alone, confirmed
          # live on PRs #13/#14 where phpunit itself passed clean.
          fail_ci_if_error: false

      # Codecov Test Analytics: per-test failure/flake detail, not just a
      # coverage delta. !cancelled(), not always() - still runs when phpunit
      # above failed (the junit file exists either way), but not if the whole
      # run was cancelled out from under it. Same Dependabot-token gap as above.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: reports/tests/junit.xml
          report_type: test_results
          fail_ci_if_error: false

  # Mutation-tests only the lines a pull request actually touches per
  # rules/php.md ("run it in CI over the branch's own changes"); mutation.yml
  # covers the whole hand-written layer on a schedule instead of paying for a
  # full run on every push.
  mutation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:2.9.5
          coverage: pcov
      - run: composer install --prefer-dist --no-progress
      - run: |
          vendor/bin/infection --threads=max \
            --test-framework-options="--testsuite unit" \
            --git-diff-lines --git-diff-base=origin/main \
            --logger-github

  # Proves the generated client wasn't hand-edited: regenerating from the
  # pinned submodule commit must produce a byte-identical tree. See
  # design.md's "Generated/hand-written boundary" decision.
  codegen-drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - run: ./scripts/generate.sh
      - run: git diff --exit-code src/Generated

  markdown:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: prettier --check
        run: bun run format:check
      - name: markdownlint
        run: bun run lint:md
      - name: sort-package-json --check
        run: bun run sort-package-json:check
      # `bun run audit` carries `--ignore GHSA-vfj7-8cjw-p6xm` (braces): no
      # patched release exists (the range is <= 3.0.3, the latest), and the
      # only path is markdownlint-cli2 > micromatch, which globs this repo's own
      # fixed patterns in dev tooling that doesn't ship. Remove the flag from
      # package.json once braces has a fix (alrayyes/hush-hush-php#199).
      - name: bun audit
        run: bun run audit

  # Mechanics: grammar, spelling, the phonetic article. A right answer, so
  # this one gates rather than advises.
  grammar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: ghcr.io/alrayyes/ltex-cli-plus:18.7.0@sha256:22452e86a130e528d526b60792926002983fcbf732bff09bd4e843d22816e4ea
      options: --entrypoint ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/lint-ltex.sh

  # Style: house voice, weasel words, corporate speak. Advice rather than a
  # verdict - MinAlertLevel in .vale.ini prints it, and only Vale.Terms
  # takes the job down.
  style:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/lint-vale.sh

  # Contract-test the client against a mock server built from the same pinned
  # spec, per rules/sdk-generation.md's "testing against the spec, not a
  # hand-written stub".
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:2.9.5
          extensions: ffi
      - run: composer install --prefer-dist --no-progress
      - name: Start Prism mock from the pinned spec
        run: |
          docker run -d --name prism -p 4010:4010 \
            -v "$(pwd)/hush-hush/api:/spec:ro" \
            stoplight/prism:5@sha256:3f6d29e31bfe0b99587f0f6f79c423858dd6a2ea7e1e4658273ed930a78a9acf mock -h 0.0.0.0 -m false /spec/openapi.yaml
          # -m false: Prism's default multiprocess (Node cluster) mode
          # crashes on startup in this image — see hush-hush-go's CLAUDE.md
          # for the reproduction.
          for _ in $(seq 1 30); do
            curl -sf http://localhost:4010 >/dev/null 2>&1 && break
            sleep 1
          done
      - name: Run contract tests against the mock
        run: vendor/bin/phpunit --testsuite contract
        env:
          HUSH_HUSH_BASE_URL: http://localhost:4010
      - name: Prism logs
        if: failure()
        run: docker logs prism

  # Records the client's real interactions as a Pact consumer contract.
  # Provider verification against hush-hush's actual server has to run in
  # hush-hush's own CI (see design.md's Risks — an external dependency this
  # repo can't wire up unilaterally); this job's job is only to keep
  # producing an up-to-date pact file for that to consume.
  #
  # `composer install` and the FFI-driven test run must happen on the same
  # PHP install — pact-php's native-lib downloader picks musl vs. glibc based
  # on whatever PHP composer itself runs under, so splitting these two steps
  # across different environments downloads the wrong binary (confirmed live
  # in local verification: an Alpine-installed lib failing to load under a
  # separate glibc runtime with a misleading "invalid ELF header").
  pact-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:2.9.5
          extensions: ffi
      - run: composer install --prefer-dist --no-progress
      - run: vendor/bin/phpunit --testsuite pact
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hush-hush-php-pact
          path: pact/pacts/*.json

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: commitlint
        run: |
          bunx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose

  # One Pages site, one deployment: a second deploy replaces the first, so the
  # API reference and the reports are assembled here and shipped together. It
  # runs on pull requests too (nothing deploys there), so a broken phpdoc run
  # or report step fails before the merge - league/uri 7.8.1 broke phpdoc
  # once. The gate is "nothing failed" rather than a plain needs:, because
  # the pull-request-only jobs are skipped on a push and a skipped need would
  # skip this job with them.
  build:
    needs:
      - actionlint
      - lint
      - test
      - mutation
      - codegen-drift
      - markdown
      - grammar
      - style
      - contract
      - pact-consumer
      - commits
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:2.9.5
          extensions: ffi
      - run: composer install --prefer-dist --no-progress
      - run: vendor/bin/phpdoc
      # phpDocumentor 3.10.0's config schema has no element for injecting an
      # arbitrary root-level static file into the built site (only <paths>,
      # <version>, <setting>, <template> - checked against
      # data/xsd/phpdoc.xsd), so llms.txt (llmstxt.org) is copied into the
      # output here instead of being made part of the phpdoc run itself.
      - run: cp llms.txt site/llms.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reports
          path: site/reports
      - run: cp scripts/reports-index.html site/reports/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  pages-deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The github-pages environment only admits main, so the deploy is its own
    # job and a pull request's run stops at build.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # The deploy succeeds even when the site serves a 404, so fetch the
      # real file. The retries cover the CDN catching up.
      - name: Check the live coverage report
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --location --retry 6 --retry-delay 10 \
            --retry-all-errors --output coverage.xml \
            "${PAGE_URL%/}/reports/coverage/coverage.xml"
          grep -q '<coverage ' coverage.xml
