# The gate. Every command in here has a twin in lefthook.yml, so a green
# pre-commit means a green pipeline and neither can drift into being the only
# place a rule is enforced.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.2"

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:2.9.5
          extensions: ffi
      - run: composer install --prefer-dist --no-progress
      # Not --strict: it treats "exact version constraints should be
      # avoided" as a failing warning, which directly fights this org's
      # deliberate pin-everything convention (see rules/dependencies.md).
      - run: composer validate
      - run: vendor/bin/phpstan analyse --memory-limit=512M
      - run: vendor/bin/phpcs
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - run: composer normalize --dry-run

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:2.9.5
          extensions: ffi
          coverage: pcov
      - run: composer install --prefer-dist --no-progress
      - name: phpunit (hand-written layer only; see design.md's testing layers)
        run: vendor/bin/phpunit --testsuite unit --coverage-clover=coverage.xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          # A Dependabot PR doesn't get repo secrets by default (GitHub's
          # own restriction, not a misconfiguration here) - CODECOV_TOKEN
          # is empty on that run, and this repo's branch protection makes
          # Codecov refuse a tokenless upload ("Token required because
          # branch is protected"). That's an upload hiccup on an
          # unprivileged run, not a real test regression - true here would
          # fail every Dependabot PR's CI on that basis alone, confirmed
          # live on PRs #13/#14 where phpunit itself passed clean.
          fail_ci_if_error: false

  # Proves the generated client wasn't hand-edited: regenerating from the
  # pinned submodule commit must produce a byte-identical tree. See
  # design.md's "Generated/hand-written boundary" decision.
  codegen-drift:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - run: ./scripts/generate.sh
      - run: git diff --exit-code src/Generated

  markdown:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: prettier --check
        run: bun run format:check
      - name: markdownlint
        run: bun run lint:md

  # Contract-test the client against a mock server built from the same pinned
  # spec, per rules/sdk-generation.md's "testing against the spec, not a
  # hand-written stub".
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:2.9.5
          extensions: ffi
      - run: composer install --prefer-dist --no-progress
      - name: Start Prism mock from the pinned spec
        run: |
          docker run -d --name prism -p 4010:4010 \
            -v "$(pwd)/hush-hush/api:/spec:ro" \
            stoplight/prism:5 mock -h 0.0.0.0 -m false /spec/openapi.yaml
          # -m false: Prism's default multiprocess (Node cluster) mode
          # crashes on startup in this image — see hush-hush-go's CLAUDE.md
          # for the reproduction.
          for _ in $(seq 1 30); do
            curl -sf http://localhost:4010 >/dev/null 2>&1 && break
            sleep 1
          done
      - name: Run contract tests against the mock
        run: vendor/bin/phpunit --testsuite contract
        env:
          HUSH_HUSH_BASE_URL: http://localhost:4010
      - name: Prism logs
        if: failure()
        run: docker logs prism

  # Records the client's real interactions as a Pact consumer contract.
  # Provider verification against hush-hush's actual server has to run in
  # hush-hush's own CI (see design.md's Risks — an external dependency this
  # repo can't wire up unilaterally); this job's job is only to keep
  # producing an up-to-date pact file for that to consume.
  #
  # `composer install` and the FFI-driven test run must happen on the same
  # PHP install — pact-php's native-lib downloader picks musl vs. glibc based
  # on whatever PHP composer itself runs under, so splitting these two steps
  # across different environments downloads the wrong binary (confirmed live
  # in local verification: an Alpine-installed lib failing to load under a
  # separate glibc runtime with a misleading "invalid ELF header").
  pact-consumer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:2.9.5
          extensions: ffi
      - run: composer install --prefer-dist --no-progress
      - run: vendor/bin/phpunit --testsuite pact
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hush-hush-php-pact
          path: pact/pacts/*.json

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: commitlint
        run: |
          bunx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose
