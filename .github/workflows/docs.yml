# Builds the API reference from PHPDoc blocks and publishes it to GitHub
# Pages. Separate from ci.yml's own jobs since this deploys something
# (a live site), not just checks a diff.
#
# On a push to main the same build also stages the test and coverage reports
# under /reports/. A Pages deploy replaces the whole site, so they have to
# ship with every one. The reports step runs phpunit itself, so a red test
# run fails the build and nothing deploys.
#
# Also runs on pull_request (build only, deploy stays push-to-main-only)
# so a dependency bump that breaks phpdoc itself — league/uri 7.8.1 did,
# see #75 — fails PR checks instead of only main's push-triggered run.
name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.4"
          tools: composer:2.9.5
          extensions: ffi
          # pcov only on a push: it's what the reports step needs, and a
          # pull request's own coverage is ci.yml's job.
          coverage: ${{ github.event_name == 'push' && 'pcov' || 'none' }}
      - run: composer install --prefer-dist --no-progress
      - run: vendor/bin/phpdoc
      # phpDocumentor 3.10.0's config schema has no element for injecting an
      # arbitrary root-level static file into the built site (only <paths>,
      # <version>, <setting>, <template> — checked against
      # data/xsd/phpdoc.xsd), so llms.txt (llmstxt.org) is copied into the
      # output here instead of being made part of the phpdoc run itself.
      - run: cp llms.txt site/llms.txt
      - name: Build the test and coverage reports
        if: github.event_name == 'push'
        # Same suite as ci.yml's test job. Clover is PHPUnit's native
        # coverage file, Cobertura is the one other tools read.
        run: |
          mkdir -p site/reports/tests site/reports/coverage
          vendor/bin/phpunit --testsuite unit \
            --log-junit site/reports/tests/junit.xml \
            --coverage-html site/reports/coverage \
            --coverage-cobertura site/reports/coverage/coverage.xml \
            --coverage-clover site/reports/coverage/clover.xml
          cp scripts/reports-index.html site/reports/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # The deploy succeeds even when the site serves a 404, so fetch the
      # real file. The retries cover the CDN catching up.
      - name: Check the live coverage report
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --location --retry 6 --retry-delay 10 \
            --retry-all-errors --output coverage.xml \
            "${PAGE_URL%/}/reports/coverage/coverage.xml"
          grep -q '<coverage ' coverage.xml
