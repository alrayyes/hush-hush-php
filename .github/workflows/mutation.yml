# The full-codebase mutation run rules/php.md asks a scheduled job carry,
# since ci.yml's own `mutation` job only ever mutates a pull request's own
# diff. No minMsi gate yet -- infection.json5's own comment explains why.
name: mutation

on:
  schedule:
    - cron: "0 8 * * 0" # weekly, Sunday 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          tools: composer:2.9.5
          coverage: pcov
      - run: composer install --prefer-dist --no-progress
      - run: vendor/bin/infection --threads=max --test-framework-options="--testsuite unit"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: hush-hush-php-infection-log
          path: infection.log
