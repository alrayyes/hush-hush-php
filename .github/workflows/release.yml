# Nobody picks a version by hand for hand-written-code changes:
# release-please reads Conventional Commits on main and keeps a release pull
# request open with the next version and changelog entry. For a
# regeneration pull request specifically, the commit message's bump marker
# is set by codegen.yml from the oasdiff classification, not written by
# a person — see design.md's "Versioning via spec diff" decision.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # RELEASE_TOKEN, not the default GITHUB_TOKEN or a GitHub App token:
      # #94 swapped this for a GitHub App installation token to avoid
      # sharing the alrayyes account's API quota, but the App's
      # APP_ID/APP_PRIVATE_KEY secrets were never actually added to this
      # repo -- reverted back to RELEASE_TOKEN so release automation isn't
      # stuck on that account-level step; the App swap can happen for real
      # once it's set up.
      #
      # Was also Wandalen/wretry.action-wrapped for the transient-rate-
      # limit retry rules/releases.md documents — dropped because that
      # wrapper's nested-action composition doesn't actually invoke
      # release-please-action at all under GitHub's forced Node 20->24
      # runtime (2025-09-19 deprecation): the step reports success with
      # zero output and no release PR ever appears. No fixed wretry.action
      # release exists upstream (Wandalen/wretry.action#193, still open;
      # the one PR attempting it, #194, closed unmerged). hush-hush-go#103
      # has the diagnosis; re-add the wrapper once upstream ships a
      # Node 24-compatible release.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
