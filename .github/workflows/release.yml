# Nobody picks a version by hand for hand-written-code changes:
# release-please reads Conventional Commits on main and keeps a release pull
# request open with the next version and changelog entry. For a
# regeneration pull request specifically, the commit message's bump marker
# is set by codegen.yml from the oasdiff classification, not written by
# a person — see design.md's "Versioning via spec diff" decision.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Installation token for the repo's GitHub App, not a personal PAT:
      # it draws from its own API quota instead of sharing the alrayyes
      # account's 5,000/hr bucket with every other gh/API call that
      # account makes (#94).
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      # release-please-action is a `uses:` step, so nick-fields/retry (which
      # only runs a shell command) can't wrap it directly — wretry.action
      # wraps another action's own uses:/with: instead. Retries a secondary
      # GitHub API rate limit / abuse-detection response, which clears
      # itself within seconds and has nothing to do with the token's hourly
      # quota genuinely running out (rules/releases.md's "Retry a release
      # job through GitHub's transient rate limit"; also mitigates #94's
      # shared-account-quota failure mode).
      - uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea # v3.8.0
        with:
          action: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
          with: |
            token: ${{ steps.app-token.outputs.token }}
            config-file: release-please-config.json
            manifest-file: .release-please-manifest.json
          attempt_limit: 3
          attempt_delay: 30000
