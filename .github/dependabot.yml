# Dependabot raises the pull request; CI decides whether it lands.
# Everything here is pinned to an exact version, which is the whole reason
# this works — a floating range drifts silently and there's nothing to raise
# a pull request about.
version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 10
    commit-message:
      prefix: fix
      include: scope
    # league/uri carries a base-URI-resolution regression from 7.6 onward
    # that breaks vendor/bin/phpdoc (thephpleague/uri-src#175) — fixed once
    # already by re-pinning to 7.5.1 (#91, tracked in #75). Ignored here so
    # Dependabot stops proposing the same broken bump on a schedule; drop
    # this once upstream actually fixes the regression.
    ignore:
      - dependency-name: "league/uri"
        versions: [">7.5.1"]
    groups:
      php-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
      php-dependencies-major:
        patterns: ["*"]
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
      actions-major:
        patterns: ["*"]
        update-types: [major]

  # Nothing here is JavaScript. package.json exists so commitlint can
  # resolve the shared config it extends, which bunx alone cannot do.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    commit-message:
      prefix: chore
      include: scope
    groups:
      tooling:
        patterns: ["*"]
        update-types: [minor, patch]
      tooling-major:
        patterns: ["*"]
        update-types: [major]
