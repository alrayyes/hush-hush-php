# The same commands CI runs, so the two cannot drift. The hook catches it
# early; CI is the gate that cannot be skipped. pre-commit judges only what
# the commit contains ({staged_files}, never the tree, never the network);
# whole-tree checks live in pre-push. PHP commands run through
# scripts/composer.sh (the pinned composer:2.9.5 image) — see rules/php.md's
# "no PHP interpreter" guidance.

# Silent on a clean run, full detail on a failure. lefthook's default prints a
# banner and a line per job, which is noise to a person and pure token cost once
# a hook's output lands in an agent's tool result (rules/linting.md).
output:
  - failure

pre-commit:
  jobs:
    - name: cs-fixer
      glob: "*.php"
      exclude: "src/Generated/*"
      run: ./scripts/composer.sh exec -- php-cs-fixer fix --config=.php-cs-fixer.dist.php --path-mode=intersection -- {staged_files}
      stage_fixed: true

    - name: phpcs-fix
      glob: "*.php"
      exclude: "src/Generated/*"
      run: ./scripts/composer.sh exec -- phpcbf --standard=phpcs.xml.dist -- {staged_files}
      stage_fixed: true

    - name: normalize
      glob: "composer.json"
      run: ./scripts/composer.sh normalize
      stage_fixed: true

    - name: sort-package-json
      glob: "package.json"
      run: bunx sort-package-json {staged_files}
      stage_fixed: true

    - name: prettier
      glob: "*.{md,yml,yaml}"
      run: bunx prettier --write {staged_files}
      stage_fixed: true

    - name: markdownlint
      glob: "*.md"
      run: bunx markdownlint-cli2 --no-globs {staged_files}

    - name: vale
      glob: "*.md"
      run: ./scripts/lint-vale.sh {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      run: bunx commitlint --edit {1}

pre-push:
  parallel: true
  jobs:
    - name: phpstan
      run: ./scripts/composer.sh exec -- phpstan analyse --memory-limit=512M

    - name: phpmd
      run: ./scripts/composer.sh exec -- phpmd src text phpmd.xml.dist --exclude src/Generated

    - name: phpcs
      run: ./scripts/composer.sh exec -- phpcs

    - name: cs-fixer-check
      run: ./scripts/composer.sh exec -- php-cs-fixer fix --dry-run --diff

    - name: rector-check
      run: ./scripts/composer.sh exec -- rector process --dry-run

    - name: audit
      run: ./scripts/composer.sh audit

    - name: test
      run: ./scripts/composer.sh exec -- phpunit --testsuite unit

    - name: format:check
      run: bun run format:check

    - name: lint:md
      run: bun run lint:md

    - name: vale
      run: ./scripts/lint-vale.sh

    - name: actionlint
      run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

    - name: ltex
      run: ./scripts/lint-ltex.sh

    - name: sort-package-json:check
      run: bun run sort-package-json:check

    - name: audit:bun
      run: bun run audit
